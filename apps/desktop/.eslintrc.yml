root: true
env:
  browser: true
  es2022: true
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaVersion: 2022
  sourceType: module
  ecmaFeatures:
    jsx: true
settings:
  react:
    version: "18"
plugins:
  - "@typescript-eslint"
  - react-hooks
  - react-refresh
extends:
  - eslint:recommended
  - plugin:@typescript-eslint/recommended
rules:
  react-refresh/only-export-components:
    - warn
    - allowConstantExport: true
  "@typescript-eslint/no-unused-vars":
    - warn
    - argsIgnorePattern: "^_"
      varsIgnorePattern: "^_"
  "@typescript-eslint/consistent-type-imports": warn
ignorePatterns:
  - dist
  - src-tauri
  - "*.config.js"
  - "*.config.ts"
