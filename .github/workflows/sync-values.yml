name: sync-values

# Automated MM2Values refresh. Runs the collector, bundles any changed
# values into the snapshot, commits straight to main, and redeploys the GitHub
# Pages feed — so new values reach installed apps with zero manual work.
on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC). Runs are cheap and only
    # commit + deploy when the snapshot actually changes. Polling several times a
    # day means a value change is picked up within hours no matter when MM2Values
    # updates, and a single skipped/delayed cron slot (GitHub schedules are
    # best-effort) no longer costs a whole day of freshness.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Serialise this job and don't clash with a manual publish-values run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    name: refresh MM2Values snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync values from MM2Values
        run: npm run sync:values --workspace @tradelens/source-adapters

      - name: Validate snapshot
        run: |
          npm test --workspace @tradelens/source-adapters
          npm run assets:validate

      - name: Detect snapshot changes
        id: diff
        run: |
          if git diff --quiet -- packages/source-adapters/src/mm2values-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No value changes found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            revision=$(node -p "require('./packages/source-adapters/src/mm2values-snapshot.json').revision")
            generated=$(node -p "require('./packages/source-adapters/src/mm2values-snapshot.json').generatedAt")
            echo "revision=$revision" >> "$GITHUB_OUTPUT"
            echo "generated=$generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/source-adapters/src/mm2values-snapshot.json
          git commit -m "chore(values): daily MM2Values sync (revision ${{ steps.diff.outputs.revision }})"
          git push origin HEAD:main

      # Publish the feed directly. A push made with GITHUB_TOKEN does not trigger
      # publish-values.yml (GitHub's anti-recursion rule), so this job deploys
      # the Pages feed itself whenever the snapshot changed.
      - name: Assemble signed snapshot release atomically
        if: steps.diff.outputs.changed == 'true'
        env:
          SNAPSHOT_SIGNING_KEY: ${{ secrets.SNAPSHOT_SIGNING_KEY }}
          SNAPSHOT_KEY_ID: mm2-tradelens-2026-08
        run: |
          set -euo pipefail
          if [ -z "${SNAPSHOT_SIGNING_KEY:-}" ]; then
            echo "SNAPSHOT_SIGNING_KEY secret is not set; refusing to build an unsigned feed." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SNAPSHOT_SIGNING_KEY" > signing.pem
          node scripts/assemble-snapshot-release.mjs \
            --key signing.pem --key-id "$SNAPSHOT_KEY_ID" \
            --minimum-revision 17 --out _site
          rm -f signing.pem

      - name: Upload complete snapshot release
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-release-${{ steps.diff.outputs.revision }}
          path: _site
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        if: steps.diff.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.diff.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
