name: sync-values

# Daily automated MM2Values refresh. Runs the collector, bundles any changed
# values into the snapshot, and commits straight to main. Pushing the snapshot
# triggers publish-values.yml, which redeploys the GitHub Pages feed — so new
# values reach installed apps with zero manual work.
on:
  schedule:
    # Every day at 07:00 UTC. Runs are cheap and only open a PR when the
    # snapshot actually changes, so daily polling keeps values fresh.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-values
  cancel-in-progress: true

jobs:
  sync:
    name: refresh MM2Values snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync values from MM2Values
        run: npm run sync:values --workspace @tradelens/source-adapters

      - name: Validate snapshot
        run: npm test --workspace @tradelens/source-adapters

      - name: Detect snapshot changes
        id: diff
        run: |
          if git diff --quiet -- packages/source-adapters/src/mm2values-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No value changes found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            revision=$(node -p "require('./packages/source-adapters/src/mm2values-snapshot.json').revision")
            generated=$(node -p "require('./packages/source-adapters/src/mm2values-snapshot.json').generatedAt")
            echo "revision=$revision" >> "$GITHUB_OUTPUT"
            echo "generated=$generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/source-adapters/src/mm2values-snapshot.json
          git commit -m "chore(values): daily MM2Values sync (revision ${{ steps.diff.outputs.revision }})"
          git push origin HEAD:main
