name: publish-values

# Publishes the bundled MM2Values snapshot to GitHub Pages as a free, static
# HTTPS values feed. Installed apps read this every ~15 minutes (and when the
# user presses "Check for updates"), so merging a daily value sync reaches
# users automatically — no installer rebuild required.
#
# It serves three extension-less files the desktop app derives from its base URL:
#   /v1/snapshot         -> the full ValueSnapshot JSON
#   /v1/revision         -> { "revision": N } (a lightweight pre-check)
#   /v1/signed-snapshot  -> Ed25519-signed envelope the client verifies
#
# The signing private key lives in the SNAPSHOT_SIGNING_KEY repository secret
# (PKCS#8 PEM). Its public half is baked into the desktop build, so installed
# apps only apply values that carry a valid signature.
on:
  push:
    branches: [main]
    paths:
      - packages/source-adapters/src/mm2values-snapshot.json
      - apps/desktop/public/icons/items/**
      - scripts/assemble-snapshot-release.mjs
      - .github/workflows/publish-values.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish values feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate snapshot and assets
        run: |
          npm test --workspace @tradelens/source-adapters
          npm run assets:validate

      - name: Assemble signed snapshot release atomically
        env:
          SNAPSHOT_SIGNING_KEY: ${{ secrets.SNAPSHOT_SIGNING_KEY }}
          SNAPSHOT_KEY_ID: mm2-tradelens-2026-08
        run: |
          set -euo pipefail
          if [ -z "${SNAPSHOT_SIGNING_KEY:-}" ]; then
            echo "SNAPSHOT_SIGNING_KEY secret is not set; refusing to build an unsigned feed." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SNAPSHOT_SIGNING_KEY" > signing.pem
          node scripts/assemble-snapshot-release.mjs \
            --key signing.pem --key-id "$SNAPSHOT_KEY_ID" \
            --minimum-revision 17 --out _site
          rm -f signing.pem

      - name: Upload complete snapshot release
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-release
          path: _site
          if-no-files-found: error
          retention-days: 30

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
