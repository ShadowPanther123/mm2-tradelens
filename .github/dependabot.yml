version: 2
updates:
  # Root npm workspace (apps, packages, services).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Monitor the client router separately so routing updates are visible and
      # can be reviewed without being buried in tooling batches.
      react-router:
        patterns:
          - react-router
          - react-router-dom
      # Batch low-risk dev tooling into a single PR to reduce noise.
      dev-dependencies:
        dependency-type: development
    labels:
      - dependencies
      - javascript

  # Rust crates for the Tauri desktop backend.
  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust

  # Keep the GitHub Actions themselves current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
